services:
  - type: web
    name: gibbon-school
    env: docker
    plan: free
    branch: main
    dockerfilePath: Dockerfile
    autoDeploy: true
    envVars:
      - key: DB_HOST
        value: db4free.net
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        value: gibbon_db
      - key: DB_USER
        value: gibbon
      - key: DB_PASS
        value: 133600Cj.
